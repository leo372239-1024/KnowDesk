[project]
name = "knowdesk-backend"
version = "0.1.0"
description = "KnowDesk - GraphRAG 模式的 Agent 编排企业知识库智能问答系统（后端）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29,<0.31",
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pymilvus>=2.4,<3.0",
    "rank-bm25>=0.2.2,<0.3",
    "jieba>=0.42,<0.43",
    "numpy>=1.26",
    "structlog>=24.1,<25.0",
    "celery>=5.4,<6.0",
    "redis>=5.0,<6.0",
    "httpx>=0.27,<0.29",
    "python-multipart>=0.0.9,<0.1",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "pyjwt>=2.8,<3.0",
    "langgraph>=0.2,<1.0",
    "langchain-core>=0.2,<1.0",
    "pypdf>=4.2,<6.0",
    "pdfplumber>=0.11,<1.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "markdown-it-py>=3.0,<4.0",
    "minio>=7.2,<8.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.7,<4.0",
    "FlagEmbedding>=1.2,<2.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.4,<1.0",
    "pytest-cov>=5.0,<6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
